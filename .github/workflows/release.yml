name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"

  build:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: tar -C target/${{ matrix.target }}/release -czf qmk-herdr-${{ matrix.target }}.tar.gz qmk-herdr
      - run: gh release upload "$RELEASE_TAG" qmk-herdr-${{ matrix.target }}.tar.gz --clobber
